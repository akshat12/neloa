name: Publish unsigned preview

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing version tag to build and publish"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}
    steps:
      - name: Check out release tag
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Verify release version
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          plist_version=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' Resources/Info.plist)
          if [[ "$version" != "$plist_version" ]]; then
            echo "Tag version $version does not match Info.plist version $plist_version" >&2
            exit 1
          fi

      - name: Run deterministic checks
        run: make test

      - name: Build Apple silicon unsigned ZIP
        shell: bash
        run: |
          set -euo pipefail
          build_number=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' Resources/Info.plist)
          make unsigned-release \
            RELEASE_VERSION="${RELEASE_TAG#v}" \
            BUILD_NUMBER="$build_number"

      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          zip="dist/Neloa-$version-macOS-apple-silicon-unsigned.zip"
          gh release create "$RELEASE_TAG" \
            "$zip" "$zip.sha256" \
            --verify-tag \
            --generate-notes \
            --prerelease \
            --title "Neloa $version (unsigned preview)" \
            --notes "This is an unsigned developer preview. macOS will require explicit approval in System Settings → Privacy & Security before first launch. See the README for installation steps."
